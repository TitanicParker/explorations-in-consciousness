<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Explorations in Consciousness</title>

  <meta name="theme-color" content="#fcfbf7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Open Field" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #3c2b23;
      --control-height: 74px;
      --paper-top: #fcfbf7;
      --paper-mid: #f7f3ea;
      --paper-bottom: #f0eadf;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: linear-gradient(180deg, var(--paper-top) 0%, var(--paper-mid) 52%, var(--paper-bottom) 100%);
      font-family: "Cormorant Garamond", serif;
      touch-action: manipulation;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(118, 92, 64, 0.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118, 92, 64, 0.010) 1px, transparent 1px);
      background-size: 42px 42px, 42px 42px;
      opacity: 0.22;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }

    .viewport::before,
    .viewport::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      height: 18vh;
      pointer-events: none;
      z-index: 4;
    }

    .viewport::before {
      top: 0;
      background: linear-gradient(180deg, var(--paper-top) 0%, rgba(252,251,247,0.86) 48%, rgba(252,251,247,0) 100%);
    }

    .viewport::after {
      bottom: 0;
      background: linear-gradient(0deg, var(--paper-bottom) 0%, rgba(240,234,223,0.84) 48%, rgba(240,234,223,0) 100%);
    }

    .page {
      width: min(760px, 91vw);
      margin: 0 auto;
      padding: 32vh clamp(18px, 5vw, 34px) calc(72vh + var(--control-height));
      position: relative;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .title {
      text-align: center;
      font-size: clamp(20px, 5vw, 39px);
      font-weight: 500;
      letter-spacing: 0.075em;
      margin-bottom: 8px;
      color: rgba(76, 61, 48, 0.54);
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,0.54);
    }

    .subtitle {
      text-align: center;
      font-size: clamp(16px, 3.8vw, 23px);
      font-weight: 500;
      letter-spacing: 0.08em;
      margin: 0 0 clamp(72px, 16vh, 128px);
      color: rgba(76, 61, 48, 0.44);
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,0.50);
    }

    #reader {
      font-size: clamp(22px, 6.2vw, 37px);
      line-height: 1.72;
      letter-spacing: clamp(0.006em, 0.16vw, 0.024em);
      font-weight: 500;
      text-rendering: optimizeLegibility;
      color: rgba(57, 39, 30, 0.90);
    }

    #reader p { margin: 0 0 0.78em; }

    .hint {
      font-size: clamp(17px, 4vw, 21px);
      line-height: 1.45;
      color: rgba(76, 61, 48, 0.36);
      text-align: center;
      margin: 56px auto 0;
      max-width: 640px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.46);
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(0);
      z-index: 5;
      display: grid;
      grid-template-columns: auto auto auto minmax(112px, 1fr) auto;
      gap: 9px;
      align-items: center;
      width: min(680px, calc(100vw - 24px));
      min-height: var(--control-height);
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(120, 96, 72, 0.16);
      background: rgba(255, 250, 240, 0.84);
      box-shadow: 0 10px 24px rgba(72, 54, 36, 0.08);
      font-size: clamp(16px, 4vw, 18px);
      color: rgba(60, 43, 35, 0.72);
      opacity: 1;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .controls.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(calc(100% + 24px));
    }

    button,
    input { font: inherit; }

    button {
      border: 1px solid rgba(120, 96, 72, 0.16);
      background: rgba(255, 248, 236, 0.76);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow: none;
      touch-action: manipulation;
      white-space: nowrap;
    }

    button:hover { background: rgba(255, 252, 246, 0.9); }

    .speed-control {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    input[type="range"] {
      width: 100%;
      min-width: 96px;
      accent-color: #9b8b7a;
    }

    .time-readout {
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: rgba(60, 43, 35, 0.62);
    }

    @media (max-width: 540px) {
      :root { --control-height: 68px; }

      .controls {
        grid-template-columns: auto auto auto 1fr auto;
        gap: 6px;
        padding: 9px 9px;
      }

      button { padding: 8px 10px; }
      .speed-control span { display: none; }
      input[type="range"] { min-width: 80px; }

      .page {
        width: 93vw;
        padding-top: 32vh;
        padding-inline: 20px;
      }

      .subtitle { margin-bottom: 76px; }
      .hint { display: none; }
    }

    @media (max-width: 390px) {
      .controls { font-size: 15px; }
      button { padding-inline: 8px; }
      .time-readout { min-width: 30px; }
    }
  </style>
</head>

<body>
  <div class="viewport" id="viewport">
    <main class="page" id="page">
      <div class="title">Explorations in Consciousness</div>
      <div class="subtitle">Be the Open Field</div>
      <div id="reader" aria-live="polite"></div>
      <div class="hint">The full text is present from the beginning. The page moves at a gentle prompter pace.</div>
    </main>
  </div>

  <div class="controls" id="controls" aria-label="Reader controls">
    <button id="playPause">Pause</button>
    <button id="restart">Restart</button>
    <button id="fullscreen">Full</button>
    <label class="speed-control">
      <span>Speed</span>
      <input id="speed" type="range" min="10" max="25" value="17" step="1" />
    </label>
    <span class="time-readout" id="timeReadout">17m</span>
  </div>

  <script>
    const page = document.getElementById("page");
    const reader = document.getElementById("reader");
    const playPause = document.getElementById("playPause");
    const restart = document.getElementById("restart");
    const fullscreen = document.getElementById("fullscreen");
    const speed = document.getElementById("speed");
    const controls = document.getElementById("controls");
    const timeReadout = document.getElementById("timeReadout");

    let text = "";
    let running = false;
    let animationFrame = null;
    let startTime = 0;
    let elapsedBeforePause = 0;
    let maxTravel = 0;
    let currentY = 0;
    let hideControlsTimer = null;

    function cleanText(content) {
      return content
        .replace(/^\s*#\s*Be the Open Field\s*/i, "")
        .trim();
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function buildText() {
      const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      reader.innerHTML = paragraphs.map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, "<br>")}</p>`).join("");
      recalculateTravel();
    }

    function recalculateTravel() {
      const viewportHeight = window.innerHeight;
      const pageHeight = page.scrollHeight;
      maxTravel = Math.max(0, pageHeight - viewportHeight + Math.round(viewportHeight * 0.40));
      applyPosition();
    }

    function applyPosition() {
      page.style.transform = `translate3d(0, ${-currentY}px, 0)`;
    }

    function totalDurationMs() {
      return Number(speed.value) * 60 * 1000;
    }

    function currentProgress() {
      return maxTravel ? Math.min(currentY / maxTravel, 1) : 0;
    }

    function step(now) {
      if (!running) return;

      const elapsed = elapsedBeforePause + (now - startTime);
      const progress = Math.min(elapsed / totalDurationMs(), 1);
      currentY = maxTravel * progress;
      applyPosition();

      if (progress >= 1) {
        running = false;
        playPause.textContent = "Play";
        return;
      }

      animationFrame = requestAnimationFrame(step);
    }

    function start() {
      if (!text) return;
      running = true;
      playPause.textContent = "Pause";
      startTime = performance.now();
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(step);
      scheduleControlsHide();
    }

    function pause() {
      if (!running) return;
      running = false;
      playPause.textContent = "Play";
      elapsedBeforePause += performance.now() - startTime;
      cancelAnimationFrame(animationFrame);
      showControls(false);
    }

    function resetReader() {
      running = false;
      playPause.textContent = "Pause";
      cancelAnimationFrame(animationFrame);
      elapsedBeforePause = 0;
      currentY = 0;
      applyPosition();
      showControls();
      setTimeout(start, 240);
    }

    function updateSpeedFromControl() {
      const progress = currentProgress();
      timeReadout.textContent = `${speed.value}m`;
      elapsedBeforePause = progress * totalDurationMs();
      startTime = performance.now();

      if (running) {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(step);
      }
    }

    function isImmersiveMode() {
      return Boolean(document.fullscreenElement) ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    }

    function showControls(allowAutoHide = true) {
      controls.classList.remove("hidden");
      if (hideControlsTimer) clearTimeout(hideControlsTimer);
      if (allowAutoHide) scheduleControlsHide();
    }

    function scheduleControlsHide() {
      if (hideControlsTimer) clearTimeout(hideControlsTimer);

      if (!isImmersiveMode() || !running) return;

      hideControlsTimer = setTimeout(() => {
        controls.classList.add("hidden");
      }, 2200);
    }

    function updateFullscreenLabel() {
      fullscreen.textContent = document.fullscreenElement ? "Exit" : "Full";
      showControls();
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) {
        fullscreen.textContent = "Add to Home";
      }

      updateFullscreenLabel();
    }

    playPause.addEventListener("click", () => running ? pause() : start());
    restart.addEventListener("click", resetReader);
    fullscreen.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenLabel);

    speed.addEventListener("input", updateSpeedFromControl);
    speed.addEventListener("change", updateSpeedFromControl);

    ["pointerdown", "touchstart", "mousemove", "keydown"].forEach(eventName => {
      document.addEventListener(eventName, () => showControls(), { passive: true });
    });

    controls.addEventListener("pointerdown", () => showControls(false));
    controls.addEventListener("pointerup", () => scheduleControlsHide());
    controls.addEventListener("touchstart", () => showControls(false), { passive: true });
    controls.addEventListener("touchend", () => scheduleControlsHide(), { passive: true });

    window.addEventListener("resize", () => {
      const progress = currentProgress();
      recalculateTravel();
      currentY = maxTravel * progress;
      applyPosition();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) pause();
    });

    fetch(`text.txt?v=${Date.now()}`, { cache: "no-store" })
      .then(response => response.text())
      .then(content => {
        text = cleanText(content);
        buildText();
        timeReadout.textContent = `${speed.value}m`;
        setTimeout(start, 520);
      })
      .catch(() => {
        reader.textContent = "The text could not be loaded.";
        playPause.textContent = "Play";
      });
  </script>
</body>
</html>
